<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f14" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <title>Platform Football</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%23ffffff' stroke='%23222' stroke-width='1'/%3E%3C/svg%3E" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #0b0f14;
        overflow: hidden;
        height: 100%;
      }
      #app {
        width: 100%;
        height: 100vh;
        height: 100dvh;
        box-sizing: border-box;
        /* M9.1 safe area: keep the whole game (HUD + touch buttons) out of
           the notch / camera hole / gesture bar. env() works in browsers and
           newer Android WebViews; Capacitor's SystemBars plugin injects the
           --safe-area-inset-* variables for older ones. */
        padding:
          max(env(safe-area-inset-top, 0px), var(--safe-area-inset-top, 0px))
          max(env(safe-area-inset-right, 0px), var(--safe-area-inset-right, 0px))
          max(env(safe-area-inset-bottom, 0px), var(--safe-area-inset-bottom, 0px))
          max(env(safe-area-inset-left, 0px), var(--safe-area-inset-left, 0px));
      }
      /* Phaser (Scale.FIT + CENTER_BOTH) centres the canvas inside this box
         itself — no flex centring here, or it gets offset twice. */
      #game {
        width: 100%;
        height: 100%;
      }
      /* Shown until the JS bundle runs (BootScene draws its own bar). */
      #boot-loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #ffe066;
        font: bold 20px monospace;
        pointer-events: none;
      }
      /* M7.1: the game is landscape-only — on a phone held upright, cover
         it with a "turn your phone" hint (the game keeps running behind). */
      #rotate {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        background: #0b0f14;
        color: #ffe066;
        font: bold 20px monospace;
        text-align: center;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
      }
      #rotate .phone {
        width: 54px;
        height: 96px;
        border: 5px solid #ffffff;
        border-radius: 10px;
        animation: turn 1.6s ease-in-out infinite;
      }
      @keyframes turn {
        0%, 25% { transform: rotate(0deg); }
        60%, 100% { transform: rotate(-90deg); }
      }
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate { display: flex; }
      }
      canvas {
        image-rendering: pixelated;
        /* Without this, the browser's own touch handling (scroll attempt,
           edge-swipe-back gesture, long-press callout/magnifier) competes
           with Phaser's pointer events — on real phones this is what made
           the bottom-right button cluster feel unresponsive, especially
           near the screen edge. */
        touch-action: none;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <div id="app"><div id="game"></div></div>
    <div id="boot-loading">YÜKLENİYOR…</div>
    <div id="rotate"><div class="phone"></div>TELEFONU YAN ÇEVİR</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
